<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>page not found ✦ shibe's homepage</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/favicon.png" sizes="64x64" type="image/png">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 14px/1.45 "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; color: #1e1e1e;
      background: #1f3a12 url("/images/grass.webp") center / cover no-repeat fixed;
    }
    /* Windows 7 style error dialog */
    .dialog {
      width: 100%; max-width: 440px; padding: 0 7px 7px;
      background: linear-gradient(to bottom, rgba(170, 205, 235, 0.75), rgba(120, 165, 205, 0.6));
      border: 1px solid rgba(20, 40, 60, 0.7); border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 12px 40px rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      animation: open 0.25s ease-out both;
    }
    @keyframes open { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
    .titlebar { display: flex; align-items: center; height: 30px; color: #000; text-shadow: 0 0 8px #fff, 0 0 2px #fff; }
    .titlebar span { flex: 1; padding-left: 4px; }
    .close {
      display: grid; place-items: center; width: 44px; height: 19px; margin-top: -6px; align-self: flex-start;
      color: #fff; font: bold 13px/1 Tahoma, sans-serif; text-decoration: none; text-shadow: 0 0 2px #000;
      background: linear-gradient(to bottom, #e8a493, #d0522f 45%, #b8361b 50%, #d76b48);
      border: 1px solid #6b1f10; border-top: 0; border-radius: 0 0 5px 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .close:hover { filter: brightness(1.15); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 8px rgba(255, 120, 80, 0.8); }
    .body { display: flex; gap: 14px; padding: 20px 18px; background: #fff; border: 1px solid #8ea2b6; }
    .icon { flex: none; width: 36px; height: 36px; }
    .body p { margin: 0 0 8px; }
    .path { font-weight: 600; word-break: break-all; }
    .small { color: #5a5a5a; font-size: 12.5px; }
    .buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 6px 4px; background: #f0f0f0; border: 1px solid #8ea2b6; border-top: 1px solid #dfdfdf; }
    .btn {
      min-width: 86px; height: 26px; padding: 0 12px; display: inline-grid; place-items: center;
      font: inherit; font-size: 13px; color: #1e1e1e; text-decoration: none; cursor: pointer;
      background: linear-gradient(to bottom, #f2f2f2 0, #ebebeb 49%, #dddddd 50%, #cfcfcf 100%);
      border: 1px solid #707070; border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }
    .btn:hover { background: linear-gradient(to bottom, #eaf6fd 0, #d9f0fc 49%, #bee6fd 50%, #a7d9f5 100%); border-color: #3c7fb1; }
    .btn.default { border-color: #3399ff; box-shadow: inset 0 0 0 1px #9fd5ff; }
    .btn:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
    @media (prefers-reduced-motion: reduce) { .dialog { animation: none; } }
  </style>
</head>
<body>
  <div class="dialog" role="alertdialog" aria-labelledby="title" aria-describedby="message">
    <div class="titlebar"><span id="title">shibe's homepage</span><a class="close" href="/" aria-label="close and go home">✕</a></div>
    <div class="body">
      <svg class="icon" viewBox="0 0 36 36" aria-hidden="true">
        <defs><radialGradient id="red" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#ff9a8a"/><stop offset="0.5" stop-color="#e2321c"/><stop offset="1" stop-color="#8f1406"/></radialGradient></defs>
        <circle cx="18" cy="18" r="16.5" fill="url(#red)" stroke="#7a1206"/>
        <ellipse cx="18" cy="10" rx="11" ry="6" fill="#fff" opacity="0.35"/>
        <path d="M12 12l12 12M24 12L12 24" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <div id="message">
        <p>windows can't find <span class="path" id="path">that page</span>. check the spelling and try again.</p>
        <p class="small">it might have moved, or it never existed. the homepage has links to everything!</p>
      </div>
    </div>
    <div class="buttons">
      <a class="btn default" href="/" id="home">go home</a>
      <button class="btn" type="button" id="back">go back</button>
    </div>
  </div>
  <script>
    var path = location.pathname;
    try { path = decodeURIComponent(path); } catch (e) {}
    document.getElementById("path").textContent = "“" + path + "”";
    var back = document.getElementById("back");
    if (history.length > 1) back.addEventListener("click", function () { history.back(); });
    else back.hidden = true;
    document.getElementById("home").focus();
  </script>
</body>
</html>
